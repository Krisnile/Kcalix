name: 功能建议
description: 提议新的功能或体验改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 说明谁在什么情况下遇到了什么问题。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 描述希望达到的结果，不必限定具体实现。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 如有具体交互或实现想法，可在此说明。
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 说明目前如何处理，以及该方式的不足。
